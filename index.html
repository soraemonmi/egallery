<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>イラスト投稿サイトかるてんてん</title>
<script src="https://cdn.jsdelivr.net/npm/appwrite@23.0.0"></script>
<style>
:root{--bg:#f5f6fb;--card:#fff;--text:#20242d;--muted:#6f7582;--line:#e5e7ef;--accent:#5b5de8;--danger:#dc3545;--shadow:0 10px 30px rgba(0,0,0,.07)}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:5;background:rgba(245,246,251,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.wrap{max-width:1100px;margin:auto;padding:16px}.top,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}h1{font-size:23px;margin:0}.sub,.hint{font-size:12px;color:var(--muted)}main{max-width:1100px;margin:auto;padding:18px 16px 50px}.notice{background:#eef1ff;color:#394099;padding:11px 13px;border-radius:12px;font-size:13px;margin-bottom:14px}.toolbar{display:flex;gap:10px;margin-bottom:16px}.search{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}button,input,textarea{font:inherit}button{padding:10px 13px;border-radius:12px;border:0;cursor:pointer}.primary{background:var(--accent);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.danger{background:#fff0f2;color:var(--danger);border:1px solid #ffd2d7}.small{padding:7px 10px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.thumb{width:100%;aspect-ratio:1;object-fit:cover;background:#eee;display:block;cursor:pointer}.body{padding:13px}.title{font-size:17px;font-weight:800;line-height:1.3}.author{color:var(--accent);margin-top:5px;cursor:pointer}.desc{color:var(--muted);font-size:13px;margin-top:7px;white-space:pre-wrap;word-break:break-word}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{padding:35px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:18px}dialog{width:min(760px,94vw);border:0;border-radius:22px;padding:0;box-shadow:0 25px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.6)}.modal{padding:18px}.modal h2{margin:0 0 12px}.close{float:right}.modal img{max-width:100%;max-height:65vh;display:block;margin:auto;border-radius:16px}.form{display:grid;gap:10px}.form input,.form textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.comment{padding:12px 0;border-bottom:1px solid var(--line)}.commentHead{display:flex;justify-content:space-between;gap:8px}.commentAuthor{font-weight:700}.commentDate{font-size:11px;color:var(--muted)}footer{max-width:1100px;margin:auto;padding:0 16px 30px;color:var(--muted);font-size:12px}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.body{padding:10px}.title{font-size:15px}}
</style>
</head>
<body>
<header><div class="wrap top"><div><h1>イラスト投稿かるてんてん‪🎨</h1><div class="sub">ログインなしで投稿できます</div></div><div class="row"><button class="ghost" id="reloadBtn">↻ 更新</button><button class="ghost" id="adminBtn">管理者</button></div></div></header>
<main><div id="status" class="notice">準備中…</div><div class="toolbar"><input id="search" class="search" placeholder="作品名・作者名・説明で検索"><button class="primary" id="newBtn">＋ 投稿</button></div><div id="gallery" class="grid"></div></main>
<footer>匿名セッションを使って投稿者を識別します。ブラウザデータを消すと、その匿名ユーザーとして以前の作品を管理できなくなります。</footer>

<dialog id="postDialog"><div class="modal"><button class="ghost close" onclick="postDialog.close()">閉じる</button><h2>作品を投稿</h2><div class="form"><input id="title" maxlength="80" placeholder="作品名"><input id="author" maxlength="40" placeholder="作者名"><textarea id="description" maxlength="500" rows="4" placeholder="ひとこと（任意）"></textarea><input id="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><label class="row"><input id="commentsEnabled" type="checkbox" checked style="width:auto"> コメントON</label><div class="hint">画像は6MB以下。公開ギャラリーに表示されます。</div><button class="primary" id="postSubmit">投稿する</button></div></div></dialog>

<dialog id="detailDialog"><div class="modal"><button class="ghost close" onclick="detailDialog.close()">閉じる</button><img id="detailImage" alt=""><h2 id="detailTitle"></h2><div id="detailAuthor" class="author"></div><div id="detailDesc" class="desc"></div><div class="meta"><span id="detailLike"></span><span id="detailDate"></span></div><div id="detailOwnerActions" class="actions"></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="top"><h3 style="margin:0">コメント</h3><span id="commentState" class="hint"></span></div><div id="commentForm" class="form" style="margin-top:12px"><input id="commentAuthor" maxlength="40" placeholder="名前"><textarea id="commentBody" maxlength="500" rows="3" placeholder="コメント"></textarea><button class="primary" id="commentSubmit">コメントする</button></div><div id="comments" style="margin-top:10px"></div></div></dialog>

<dialog id="authorDialog"><div class="modal"><button class="ghost close" onclick="authorDialog.close()">閉じる</button><h2 id="authorTitle"></h2><div id="authorGrid" class="grid"></div></div></dialog>

<dialog id="adminDialog"><div class="modal"><button class="ghost close" onclick="adminDialog.close()">閉じる</button><h2>管理者</h2><div id="adminArea"></div></div></dialog>

<script>
const statusEl=document.getElementById('status');
const showBootStatus=(msg)=>{if(statusEl) statusEl.textContent=msg;};
window.addEventListener('error',(e)=>showBootStatus('JavaScriptエラー: '+(e.message||e.error||'不明なエラー')));
window.addEventListener('unhandledrejection',(e)=>showBootStatus('Promiseエラー: '+(e.reason?.message||e.reason||'不明なエラー')));
if(typeof Appwrite==='undefined'){showBootStatus('Appwrite SDKの読み込みに失敗しました。CDNを確認してください。');throw new Error('Appwrite SDK is not loaded');}
const {Client,Account,TablesDB,Storage,ID,Permission,Role,Query}=Appwrite;
if(!Client||!Account||!TablesDB||!Storage){showBootStatus('Appwrite SDKは読み込めましたが必要なAPIが見つかりません（Client/Account/TablesDB/Storage）。');throw new Error('Required Appwrite APIs are missing');}
showBootStatus('Appwrite SDK読み込み成功。接続を開始しています…');
// ===== ここだけ自分のAppwrite情報に変更 =====
const CONFIG={
 endpoint:"https://cloud.appwrite.io/v1",
 projectId:"6a7de2c6002b8c09d16c",
 databaseId:"6a7de405003669f124e5",
 artworksTableId:"artworks",
 commentsTableId:"comments",
 likesTableId:"likes",
 bucketId:"artworks",
 adminUserId:"6a7dee460031a02c8159"
};
// ==========================================
const client=new Client().setEndpoint(CONFIG.endpoint).setProject(CONFIG.projectId);
const account=new Account(client), db=new TablesDB(client), storage=new Storage(client);
let me=null,artworks=[],current=null;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const configured=()=>CONFIG.projectId&&!CONFIG.projectId.startsWith('YOUR_')&&CONFIG.databaseId&&!CONFIG.databaseId.startsWith('YOUR_')&&CONFIG.bucketId&&!CONFIG.bucketId.startsWith('YOUR_');
const admin=()=>!!me&&CONFIG.adminUserId&&!CONFIG.adminUserId.startsWith('YOUR_')&&me.$id===CONFIG.adminUserId;
const imageUrl=id=>storage.getFileView({bucketId:CONFIG.bucketId,fileId:id}).toString();

async function ensureSession(){try{me=await account.get()}catch{await account.createAnonymousSession();me=await account.get()}}
async function load(){const r=await db.listRows({databaseId:CONFIG.databaseId,tableId:CONFIG.artworksTableId,queries:[Query.orderDesc('$createdAt'),Query.limit(100)],total:false});artworks=r.rows||[];render()}
function render(){const q=$('search').value.trim().toLowerCase();const list=artworks.filter(a=>`${a.title} ${a.author} ${a.description}`.toLowerCase().includes(q));const g=$('gallery');if(!list.length){g.innerHTML='<div class="empty">まだ作品がありません。</div>';return}g.innerHTML=list.map(a=>{const mine=a.ownerId===me.$id;return `<article class="card"><img class="thumb" src="${esc(imageUrl(a.imageFileId))}" alt="${esc(a.title)}" data-open="${a.$id}"><div class="body"><div class="title">${esc(a.title)}</div><div class="author" data-author="${esc(a.author)}">${esc(a.author)}</div><div class="desc">${esc(a.description||'')}</div><div class="meta"><span>♥ ${Number(a.likeCount||0)}</span><span>${new Date(a.$createdAt).toLocaleDateString('ja-JP')}</span></div><div class="actions"><button class="ghost small" data-like="${a.$id}">♥ いいね</button><button class="primary small" data-open="${a.$id}">作品を見る</button>${mine||admin()?`<button class="danger small" data-open="${a.$id}">管理</button>`:''}</div></div></article>`}).join('');g.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>openDetail(x.dataset.open));g.querySelectorAll('[data-like]').forEach(x=>x.onclick=()=>likeArt(x.dataset.like));g.querySelectorAll('[data-author]').forEach(x=>x.onclick=()=>openAuthor(x.dataset.author))}
async function likeArt(id){const key=`liked_${id}`;if(localStorage.getItem(key)){alert('このブラウザでは既にいいねしています。');return}await db.createRow({databaseId:CONFIG.databaseId,tableId:CONFIG.likesTableId,rowId:ID.unique(),data:{artworkId:id,userId:me.$id},permissions:[Permission.read(Role.any()),Permission.delete(Role.user(me.$id)),...(CONFIG.adminUserId&&!CONFIG.adminUserId.startsWith('YOUR_')?[Permission.delete(Role.user(CONFIG.adminUserId))]:[])]});localStorage.setItem(key,'1');const a=artworks.find(x=>x.$id===id);if(a)a.likeCount=Number(a.likeCount||0)+1;render();if(current?.$id===id)openDetail(id)}
async function upload(file){if(!file)throw Error('画像を選んでください。');if(file.size>6*1024*1024)throw Error('画像は6MB以下にしてください。');const id=ID.unique();await storage.createFile({bucketId:CONFIG.bucketId,fileId:id,file,permissions:[Permission.read(Role.any()),Permission.delete(Role.user(me.$id)),...(CONFIG.adminUserId&&!CONFIG.adminUserId.startsWith('YOUR_')?[Permission.delete(Role.user(CONFIG.adminUserId))]:[])]});return id}
async function post(){const title=$('title').value.trim(),author=$('author').value.trim(),description=$('description').value.trim(),commentsEnabled=$('commentsEnabled').checked,file=$('image').files[0];if(!title||!author||!file){alert('作品名・作者名・画像は必須です。');return}let imageFileId=null;try{imageFileId=await upload(file);const perms=[Permission.read(Role.any()),Permission.update(Permission?Role.user(me.$id):me.$id),Permission.delete(Role.user(me.$id))];if(CONFIG.adminUserId&&!CONFIG.adminUserId.startsWith('YOUR_'))perms.push(Permission.update(Role.user(CONFIG.adminUserId)),Permission.delete(Role.user(CONFIG.adminUserId)));await db.createRow({databaseId:CONFIG.databaseId,tableId:CONFIG.artworksTableId,rowId:ID.unique(),data:{title,author,description,commentsEnabled,imageFileId,ownerId:me.$id,likeCount:0},permissions:perms});postDialog.close();$('title').value='';$('author').value='';$('description').value='';$('image').value='';await load()}catch(e){if(imageFileId){try{await storage.deleteFile({bucketId:CONFIG.bucketId,fileId:imageFileId})}catch{}}throw e}}
async function openDetail(id){current=artworks.find(a=>a.$id===id);if(!current)return;$('detailImage').src=imageUrl(current.imageFileId);$('detailTitle').textContent=current.title;$('detailAuthor').textContent=current.author;$('detailDesc').textContent=current.description||'';$('detailLike').textContent=`♥ ${Number(current.likeCount||0)}`;$('detailDate').textContent=new Date(current.$createdAt).toLocaleString('ja-JP');$('detailAuthor').onclick=()=>openAuthor(current.author);const mine=current.ownerId===me.$id||admin();$('detailOwnerActions').innerHTML=mine?`<button class="ghost small" id="toggleComments">${current.commentsEnabled?'💬 コメントをOFF':'💬 コメントをON'}</button><button class="danger small" id="deleteArtwork">🗑 作品を削除</button>`:'';if(mine){$('toggleComments').onclick=toggleComments;$('deleteArtwork').onclick=deleteArtwork}$('commentState').textContent=current.commentsEnabled?'ON':'OFF';$('commentForm').style.display=current.commentsEnabled?'grid':'none';await loadComments(current.$id);detailDialog.showModal()}
async function toggleComments(){await db.updateRow({databaseId:CONFIG.databaseId,tableId:CONFIG.artworksTableId,rowId:current.$id,data:{commentsEnabled:!current.commentsEnabled}});current.commentsEnabled=!current.commentsEnabled;render();openDetail(current.$id)}
async function deleteArtwork(){if(!confirm(`「${current.title}」を削除しますか？`))return;await db.deleteRow({databaseId:CONFIG.databaseId,tableId:CONFIG.artworksTableId,rowId:current.$id});try{await storage.deleteFile({bucketId:CONFIG.bucketId,fileId:current.imageFileId})}catch{}detailDialog.close();await load()}
async function loadComments(artworkId){const r=await db.listRows({databaseId:CONFIG.databaseId,tableId:CONFIG.commentsTableId,queries:[Query.equal('artworkId',artworkId),Query.orderAsc('$createdAt'),Query.limit(100)],total:false});const rows=r.rows||[];$('comments').innerHTML=rows.length?rows.map(c=>`<div class="comment"><div class="commentHead"><div class="commentAuthor">${esc(c.author)}</div><div class="commentDate">${new Date(c.$createdAt).toLocaleString('ja-JP')}</div></div><div style="white-space:pre-wrap;margin-top:4px">${esc(c.body)}</div>${c.userId===me.$id||current.ownerId===me.$id||admin()?`<button class="danger small" style="margin-top:7px" data-del="${c.$id}">削除</button>`:''}</div>`).join(''):'<div class="hint">まだコメントはありません。</div>';$('comments').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteComment(b.dataset.del))}
async function addComment(){if(!current?.commentsEnabled)return;const author=$('commentAuthor').value.trim(),body=$('commentBody').value.trim();if(!author||!body){alert('名前とコメントを入力してください。');return}let perms=[Permission.read(Role.any()),Permission.delete(Role.user(me.$id)),Permission.update(Role.user(me.$id)),Permission.delete(Role.user(current.ownerId)),Permission.update(Role.user(current.ownerId))];if(CONFIG.adminUserId&&!CONFIG.adminUserId.startsWith('YOUR_'))perms.push(Permission.delete(Role.user(CONFIG.adminUserId)),Permission.update(Role.user(CONFIG.adminUserId)));await db.createRow({databaseId:CONFIG.databaseId,tableId:CONFIG.commentsTableId,rowId:ID.unique(),data:{artworkId:current.$id,author,body,userId:me.$id},permissions:perms});$('commentBody').value='';await loadComments(current.$id)}
async function deleteComment(id){if(!confirm('このコメントを削除しますか？'))return;await db.deleteRow({databaseId:CONFIG.databaseId,tableId:CONFIG.commentsTableId,rowId:id});await loadComments(current.$id)}
function openAuthor(name){$('authorTitle').textContent=`作者：${name}`;const rows=artworks.filter(a=>a.author===name);$('authorGrid').innerHTML=rows.length?rows.map(a=>`<article class="card"><img class="thumb" src="${esc(imageUrl(a.imageFileId))}" data-a="${a.$id}"><div class="body"><div class="title">${esc(a.title)}</div><div class="meta"><span>♥ ${Number(a.likeCount||0)}</span></div></div></article>`).join(''):'<div class="empty">作品がありません。</div>';$('authorGrid').querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{authorDialog.close();openDetail(x.dataset.a)});authorDialog.showModal()}
function renderAdmin(){if(!admin()){$('adminArea').innerHTML=`<div class="notice">管理者ログインが必要です。</div><div class="form"><input id="adminEmail" type="email" placeholder="管理者メールアドレス"><input id="adminPass" type="password" placeholder="パスワード"><button class="primary" id="adminLogin">管理者としてログイン</button><div class="hint">通常ユーザーにはログイン画面は出ません。</div></div>`;$('adminLogin').onclick=adminLogin}else{$('adminArea').innerHTML=`<div class="notice">管理者としてログイン中：${esc(me.$id)}</div><button class="ghost" id="adminLogout">ログアウト</button>`;$('adminLogout').onclick=async()=>{await account.deleteSession({sessionId:'current'});await ensureSession();adminDialog.close();render()}}}
async function adminLogin(){try{await account.deleteSession({sessionId:'current'}).catch(()=>{});await account.createEmailPasswordSession({email:$('adminEmail').value.trim(),password:$('adminPass').value});me=await account.get();if(!admin()){alert('このアカウントは管理者User IDと一致しません。CONFIGを確認してください。');await account.deleteSession({sessionId:'current'}).catch(()=>{});await ensureSession()}else{adminDialog.close();render();alert('管理者としてログインしました。')}}catch(e){alert(e.message||'管理者ログインに失敗しました')}}
$('reloadBtn').onclick=load;$('search').oninput=render;$('newBtn').onclick=()=>postDialog.showModal();$('postSubmit').onclick=async()=>{try{$('postSubmit').disabled=true;await post()}catch(e){alert(e.message||'投稿に失敗しました')}finally{$('postSubmit').disabled=false}};$('commentSubmit').onclick=async()=>{try{$('commentSubmit').disabled=true;await addComment()}catch(e){alert(e.message||'コメントに失敗しました')}finally{$('commentSubmit').disabled=false}};$('adminBtn').onclick=()=>{renderAdmin();adminDialog.showModal()};
(async()=>{
  if(!configured()){showBootStatus('CONFIGが未設定です。projectId / databaseId / bucketIdを確認してください。');return}
  try{
    showBootStatus('Appwriteへ接続中…（匿名セッション）');
    await ensureSession();
    showBootStatus(`Appwrite認証成功：${me.$id}　データベースを読み込み中…`);
    await load();
    showBootStatus(`Appwrite接続済み：${me.$id}`);
  }catch(e){
    const msg=e?.message||String(e)||'不明なエラー';
    showBootStatus('Appwrite接続エラー：'+msg);
    console.error('Appwrite boot error:',e);
  }
})();
</script></body></html>
